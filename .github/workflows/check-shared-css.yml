name: Shared CSS coherence
on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared CSS blocks are identical
        run: |
          files=$(grep -rl 'data-shared' --include='*.html')
          n=$(echo "$files" | wc -l)
          if [ "$n" -lt 2 ]; then
            echo "Need at least 2 files with <style data-shared>; found $n"
            exit 1
          fi
          ref=""
          for f in $files; do
            css=$(xmllint --html --xpath 'string(//style[@data-shared])' "$f" 2>/dev/null)
            if [ -z "$ref" ]; then ref="$css"; ref_file="$f"; continue; fi
            if [ "$css" != "$ref" ]; then
              echo "Shared CSS mismatch: $ref_file vs $f"
              diff <(echo "$ref") <(echo "$css")
              exit 1
            fi
          done
          echo "Shared CSS is consistent across $n files."
