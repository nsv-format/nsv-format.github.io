name: Shared CSS coherence
on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared CSS blocks are identical
        run: |
          python3 -c "
          import glob, sys
          from html.parser import HTMLParser

          class SharedCSS(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self._in = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'style' and any(k == 'data-shared' for k, v in attrs):
                      self._in = True
              def handle_data(self, data):
                  if self._in: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'style' and self._in: self._in = False

          files = sorted(glob.glob('**/*.html', recursive=True))
          blocks = {}
          for f in files:
              p = SharedCSS()
              p.feed(open(f).read())
              if p.parts:
                  blocks[f] = ''.join(p.parts)

          if len(blocks) < 2:
              print(f'Need at least 2 files with <style data-shared>; found {len(blocks)}')
              sys.exit(1)

          ref_file, ref_css = next(iter(blocks.items()))
          ok = True
          for f, css in blocks.items():
              if css != ref_css:
                  print(f'Shared CSS mismatch: {ref_file} vs {f}')
                  ok = False
          if not ok:
              sys.exit(1)
          print(f'Shared CSS is consistent across {len(blocks)} files.')
          "
