<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSV Explorer</title>
<style data-shared>
  :root {
    --bg: #1a1a1a;
    --fg: #d4d4d4;
    --fg-dim: #808080;
    --border: #333;
    --accent: #e0e0e0;
    --surface: #242424;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    --sans: system-ui, -apple-system, sans-serif;
    --add-fg: #6fbf6f;
    --del-fg: #bf6f6f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
  }

  header { display: flex; align-items: baseline; gap: 16px; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }

  textarea {
    width: 100%;
    background: var(--surface);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    resize: vertical;
  }

  textarea:focus { outline: none; border-color: #555; }
</style>
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--border); }

  #status {
    font-size: 13px;
    color: var(--fg-dim);
    font-family: var(--mono);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- Drag and Drop Zone --- */
  #drop-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    border: 2px dashed var(--border);
    margin: 24px;
    border-radius: 8px;
    background-color: transparent;
    transition: all 0.2s ease;
    cursor: pointer;
  }

  #drop-zone.dragover {
    border-color: var(--add-fg);
    background-color: #2a3a2a;
  }

  #drop-zone h2 {
    margin-bottom: 8px;
    font-size: 16px;
    color: var(--fg);
  }

  #drop-zone p {
    color: var(--fg-dim);
    font-size: 14px;
    margin-top: 0;
  }

  #file-input {
    display: none;
  }

  /* --- Query Interface --- */
  #query-interface {
    display: none;
    flex: 1;
    flex-direction: column;
    padding: 24px;
    gap: 16px;
    overflow: hidden;
  }

  .editor-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  textarea { height: 120px; }

  .controls {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  button {
    background: #2a3a2a;
    border: 1px solid #3a5a3a;
    color: var(--add-fg);
    font-family: var(--sans);
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  button:hover {
    border-color: #4a7a4a;
  }
  
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: var(--border);
    color: var(--fg-dim);
    background: var(--bg);
  }

  #dl-btn {
    background: var(--bg);
    border-color: var(--border);
    color: var(--fg);
    margin-right: auto;
  }
  #dl-btn:hover {
    border-color: #555;
  }

  #table-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-start;
  }
  #table-list:empty { display: none; }
  .table-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 10px;
  }
  .table-pill-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--fg);
    cursor: pointer;
  }
  .table-pill-name:hover { color: var(--accent); }
  .table-pill-cols {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-dim);
    max-height: 72px;
    overflow-y: auto;
    line-height: 1.4;
    white-space: pre;
    margin-top: 2px;
  }
  .add-more {
    border: 1px dashed var(--border);
    border-radius: 3px;
    padding: 6px 12px;
    color: var(--fg-dim);
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-more:hover { border-color: #555; color: var(--fg); }
  #table-list.dragover .add-more {
    border-color: var(--add-fg);
    color: var(--add-fg);
    background: #2a3a2a;
  }
  .sql-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-dim);
  }
  .sql-pill:hover { border-color: #555; color: var(--fg); }
  .table-pill.pill-match { border-color: #3a5a3a; background: #2a3a2a; }
  .col-match { color: var(--fg); }

  /* --- Results Area --- */
  .results-container {
    flex: 1;
    background-color: var(--surface);
    border-radius: 4px;
    border: 1px solid var(--border);
    overflow: auto;
    position: relative;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }

  th, td {
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid #2a2a2a;
    white-space: nowrap;
  }

  th {
    background-color: #2a2a2a;
    color: var(--fg-dim);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  tr:hover td {
    background-color: #2a2a2a;
  }

  .error-message {
    color: var(--del-fg);
    padding: 16px;
    font-family: var(--mono);
    font-size: 13px;
    white-space: pre-wrap;
  }

  .null-cell {
    color: var(--fg-dim);
    font-style: italic;
  }

  .loading-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(26, 26, 26, 0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--fg-dim);
  }

  .loading-overlay.active {
    display: flex;
  }
</style>
</head>
<body>

<header>
  <h1>NSV Explorer</h1>
  <span id="status">Initializing DuckDB...</span>
</header>

<main>
  <!-- Initial State -->
  <div id="drop-zone">
    <h2>Drop your NSV file here</h2>
    <p>or click to browse</p>
    <input type="file" id="file-input" accept=".nsv,.csv,.txt,.sql" multiple>
  </div>

  <!-- Active State -->
  <div id="query-interface">
    <div id="table-list"></div>
    <div class="editor-container">
      <textarea id="sql-input" spellcheck="false"></textarea>
      <div class="controls">
        <button id="dl-btn" style="display:none">↓ NSV</button>
        <button id="run-btn" disabled>Run Query</button>
      </div>
    </div>
    
    <div class="results-container">
      <div class="loading-overlay" id="loading">Loading...</div>
      <div id="results-content"></div>
    </div>
  </div>
</main>

<script type="module">
  const DUCKDB_WASM_CDN = 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev55.0';

  // DOM Elements
  const statusEl = document.getElementById('status');
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const queryInterface = document.getElementById('query-interface');
  const sqlInput = document.getElementById('sql-input');
  const runBtn = document.getElementById('run-btn');
  const resultsContent = document.getElementById('results-content');
  const loadingOverlay = document.getElementById('loading');
  const dlBtn = document.getElementById('dl-btn');

  let db = null;
  let conn = null;
  let lastResult = null;
  let lastSql = null;
  let loadedFileName = 'data';
  const loadedTables = new Map();
  const loadedQueries = new Map();

  function updateStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.style.color = isError ? 'var(--del-fg)' : 'var(--add-fg)';
  }

  function toTableName(fileName) {
    let name = fileName.replace(/\.[^.]+$/, '');
    name = name.replace(/[^a-zA-Z0-9_]/g, '_');
    if (/^\d/.test(name)) name = '_' + name;
    if (name.length > 24) name = name.substring(0, 24);
    return name || 'data';
  }

  function updateTableList() {
    const el = document.getElementById('table-list');
    el.innerHTML = '';
    if (loadedTables.size === 0 && loadedQueries.size === 0) return;
    for (const [name, info] of loadedTables) {
      const card = document.createElement('div');
      card.className = 'table-pill';
      card.dataset.table = name;
      const nameEl = document.createElement('div');
      nameEl.className = 'table-pill-name';
      nameEl.textContent = name;
      nameEl.addEventListener('click', () => {
        sqlInput.focus();
        document.execCommand('insertText', false, name);
      });
      card.appendChild(nameEl);
      if (info.columns.length) {
        const colsEl = document.createElement('div');
        colsEl.className = 'table-pill-cols';
        colsEl.textContent = info.schema;
        card.appendChild(colsEl);
      }
      el.appendChild(card);
    }
    for (const [name, sql] of loadedQueries) {
      const pill = document.createElement('div');
      pill.className = 'sql-pill';
      pill.textContent = name + '.sql';
      pill.addEventListener('click', () => {
        sqlInput.focus();
        document.execCommand('insertText', false, sql);
      });
      el.appendChild(pill);
    }
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex;flex-direction:column;gap:4px';
    const addMore = document.createElement('div');
    addMore.className = 'add-more';
    addMore.textContent = '+ Load from file';
    addMore.addEventListener('click', () => fileInput.click());
    actions.appendChild(addMore);
    const addUrl = document.createElement('div');
    addUrl.className = 'add-more';
    addUrl.textContent = '+ Load from URL';
    addUrl.addEventListener('click', () => {
      addUrl.hidden = true;
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'https://...';
      input.style.cssText = 'background:var(--surface);color:var(--fg);border:1px dashed var(--border);border-radius:3px;padding:6px 12px;font-family:var(--mono);font-size:12px;outline:none;width:360px;max-width:100%';
      actions.insertBefore(input, addUrl);
      input.focus();
      const commit = () => {
        const url = input.value.trim();
        input.remove();
        addUrl.hidden = false;
        if (url) loadFromUrl(url).catch(() => {});
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape') { input.remove(); addUrl.hidden = false; }
      });
      input.addEventListener('blur', commit);
    });
    actions.appendChild(addUrl);
    el.appendChild(actions);
  }

  // --- 1. Initialize DuckDB-Wasm ---
  async function initDuckDB() {
    try {
      const duckdb = await import(DUCKDB_WASM_CDN + '/+esm');
      
      const BUNDLES = {
        mvp: {
          mainModule: DUCKDB_WASM_CDN + '/dist/duckdb-mvp.wasm',
          mainWorker: DUCKDB_WASM_CDN + '/dist/duckdb-browser-mvp.worker.js',
        },
        eh: {
          mainModule: DUCKDB_WASM_CDN + '/dist/duckdb-eh.wasm',
          mainWorker: DUCKDB_WASM_CDN + '/dist/duckdb-browser-eh.worker.js',
        },
      };

      const bundle = await duckdb.selectBundle(BUNDLES);
      const worker_url = URL.createObjectURL(
        new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' })
      );
      
      db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), new Worker(worker_url));
      await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
      URL.revokeObjectURL(worker_url);

      // Open with unsigned extensions allowed
      await db.open({
        allowUnsignedExtensions: true,
        query: { castBigIntToDouble: true, castTimestampToDate: true }
      });

      conn = await db.connect();

      // Install & Load custom NSV extension via absolute URL
      const extUrl = new URL('nsv.duckdb_extension.wasm', window.location.href).href;
      await conn.query(`INSTALL '${extUrl}'`);
      await conn.query(`LOAD '${extUrl}'`);

      updateStatus('DuckDB Ready');
      return duckdb; // Return module for constants
    } catch (e) {
      console.error(e);
      updateStatus(`Initialization failed: ${e.message}`, true);
      throw e;
    }
  }

  // Start initialization immediately
  const duckdbModulePromise = initDuckDB();

  // --- 2. Handle File Drop ---
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
  }

  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
  });

  dropZone.addEventListener('drop', handleDrop, false);
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
  });

  const tableListEl = document.getElementById('table-list');
  let tlDragCount = 0;
  tableListEl.addEventListener('dragenter', e => { e.preventDefault(); tlDragCount++; tableListEl.classList.add('dragover'); });
  tableListEl.addEventListener('dragleave', () => { if (--tlDragCount === 0) tableListEl.classList.remove('dragover'); });
  tableListEl.addEventListener('dragover', e => e.preventDefault());
  tableListEl.addEventListener('drop', e => { e.preventDefault(); tlDragCount = 0; tableListEl.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

  function handleDrop(e) {
    const dt = e.dataTransfer;
    const files = dt.files;
    handleFiles(files);
  }

  async function handleFiles(files) {
    if (files.length === 0) return;
    const isFirstLoad = loadedTables.size === 0;
    let duckdb;
    try { duckdb = await duckdbModulePromise; } catch { return; }
    let lastTable = null;

    for (const file of files) {
      if (/\.sql$/i.test(file.name)) {
        const text = await file.text();
        const name = file.name.replace(/\.sql$/i, '');
        loadedQueries.set(name, text);
        if (queryInterface.style.display === 'none') {
          dropZone.style.display = 'none';
          queryInterface.style.display = 'flex';
          runBtn.disabled = false;
        }
        updateTableList();
        continue;
      }
      const tableName = toTableName(file.name);
      if (loadedTables.has(tableName)) {
        updateStatus(`"${tableName}" already loaded`, true);
        continue;
      }
      try {
        updateStatus(`Loading ${file.name}...`);
        await db.registerFileHandle(file.name, file, duckdb.DuckDBDataProtocol.BROWSER_FILEREADER, true);
        await conn.query(`CREATE OR REPLACE VIEW "${tableName}" AS SELECT * FROM read_nsv('${file.name}')`);
        const probe = await conn.query(`SELECT * FROM "${tableName}" LIMIT 0`);
        const fields = probe.schema.fields;
        const columns = fields.map(f => f.name);
        let schema = '';
        try {
          const desc = await conn.query(`DESCRIBE "${tableName}"`);
          schema = desc.toArray().map(r => `${r.column_name}  ${r.column_type}`).join('\n');
        } catch (_) {
          schema = fields.map(f => `${f.name}  ${f.type}`).join('\n');
        }
        loadedTables.set(tableName, { fileName: file.name, columns, schema });
        loadedFileName = file.name;
        lastTable = tableName;
      } catch (e) {
        console.error(e);
        updateStatus(`Error loading ${file.name}: ${e.message}`, true);
      }
    }

    if (!lastTable) return;

    if (isFirstLoad) {
      dropZone.style.display = 'none';
      queryInterface.style.display = 'flex';
      if (!sqlInput.value.trim()) {
        sqlInput.value = `SELECT *\n  FROM ${lastTable}\n LIMIT 100;`;
      }
      runBtn.disabled = false;
    }

    updateTableList();
    if (isFirstLoad) await executeQuery();
    const n = loadedTables.size;
    updateStatus(`Ready (${n} table${n > 1 ? 's' : ''})`);
  }

  async function loadFromUrl(url) {
    let duckdb;
    try { duckdb = await duckdbModulePromise; } catch { return; }

    let urlObj;
    try { urlObj = new URL(url); } catch { updateStatus('Invalid URL', true); return; }
    const fileName = urlObj.pathname.split('/').pop() || 'remote.nsv';
    const tableName = toTableName(fileName);

    if (loadedTables.has(tableName)) {
      updateStatus(`"${tableName}" already loaded`, true);
      return;
    }

    try {
      updateStatus(`Fetching ${fileName}...`);
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const buf = new Uint8Array(await resp.arrayBuffer());

      await db.registerFileBuffer(fileName, buf);
      await conn.query(`CREATE OR REPLACE VIEW "${tableName}" AS SELECT * FROM read_nsv('${fileName}')`);

      const probe = await conn.query(`SELECT * FROM "${tableName}" LIMIT 0`);
      const fields = probe.schema.fields;
      const columns = fields.map(f => f.name);
      let schema = '';
      try {
        const desc = await conn.query(`DESCRIBE "${tableName}"`);
        schema = desc.toArray().map(r => `${r.column_name}  ${r.column_type}`).join('\n');
      } catch (_) {
        schema = fields.map(f => `${f.name}  ${f.type}`).join('\n');
      }

      loadedTables.set(tableName, { fileName, columns, schema, sourceUrl: url });
      loadedFileName = fileName;

      if (loadedTables.size === 1) {
        dropZone.style.display = 'none';
        queryInterface.style.display = 'flex';
        if (!sqlInput.value.trim()) {
          sqlInput.value = `SELECT *\n  FROM ${tableName}\n LIMIT 100;`;
        }
        runBtn.disabled = false;
      }

      updateTableList();
      const n = loadedTables.size;
      updateStatus(`Ready (${n} table${n > 1 ? 's' : ''})`);
    } catch (e) {
      updateStatus(
        e.name === 'TypeError' ? `Failed to fetch ${fileName} (CORS or network error)` : `Error: ${e.message}`,
        true,
      );
      throw e;
    }
  }

  // --- 3. Execute Query & Render ---
  runBtn.addEventListener('click', executeQuery);
  
  // Allow Cmd+Enter / Ctrl+Enter to run query
  sqlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { sqlInput._tabEscaped = true; return; }
    if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      if (sqlInput._completion) {
        e.preventDefault();
        const { text, start } = sqlInput._completion;
        const end = sqlInput.selectionStart;
        sqlInput.selectionStart = start;
        sqlInput.selectionEnd = end;
        document.execCommand('insertText', false, text);
        sqlInput._tabEscaped = false;
        return;
      }
      if (sqlInput._tabEscaped) { sqlInput._tabEscaped = false; return; }
      e.preventDefault();
      document.execCommand('insertText', false, '    ');
      return;
    }
    if (e.key !== 'Escape') sqlInput._tabEscaped = false;
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      executeQuery();
    }
    if ((e.metaKey || e.ctrlKey) && e.key === '/') {
      e.preventDefault();
      toggleLineComments();
    }
  });

  function toggleLineComments() {
    const { value, selectionStart, selectionEnd } = sqlInput;
    const noSel = selectionStart === selectionEnd;
    const from = value.lastIndexOf('\n', selectionStart - 1) + 1;
    let anchor = noSel ? selectionEnd : selectionEnd;
    if (!noSel && anchor > from && value[anchor - 1] === '\n') anchor--;
    const nl = value.indexOf('\n', anchor);
    const to = nl === -1 ? value.length : nl;

    const block = value.substring(from, to);
    const lines = block.split('\n');
    const nonEmpty = lines.filter(l => l.trim());
    const allCommented = nonEmpty.length > 0 && nonEmpty.every(l => /^--/.test(l));

    if (noSel) {
      if (!lines[0].trim()) return;
      if (allCommented) {
        const m = lines[0].match(/^-- ?/);
        sqlInput.selectionStart = from;
        sqlInput.selectionEnd = from + m[0].length;
        document.execCommand('insertText', false, '');
      } else {
        sqlInput.selectionStart = sqlInput.selectionEnd = from;
        document.execCommand('insertText', false, '-- ');
      }
      const nextNl = sqlInput.value.indexOf('\n', from);
      sqlInput.selectionStart = sqlInput.selectionEnd = nextNl !== -1 ? nextNl + 1 : sqlInput.value.length;
    } else {
      const toggled = lines.map(l => {
        if (!l.trim()) return l;
        return allCommented ? l.replace(/^-- ?/, '') : '-- ' + l;
      });
      const newBlock = toggled.join('\n');
      sqlInput.selectionStart = from;
      sqlInput.selectionEnd = to;
      document.execCommand('insertText', false, newBlock);
      sqlInput.selectionStart = from;
      sqlInput.selectionEnd = from + newBlock.length;
    }
  }

  function getTokenContext() {
    const { value, selectionStart } = sqlInput;
    let i = selectionStart;
    while (i > 0 && /[a-zA-Z0-9_.]/.test(value[i - 1])) i--;
    const token = value.substring(i, selectionStart);
    if (!token) return null;

    const dot = token.indexOf('.');
    if (dot !== -1) {
      return {
        type: 'column', table: token.substring(0, dot).toLowerCase(),
        prefix: token.substring(dot + 1).toLowerCase(), prefixStart: i + dot + 1,
      };
    }

    const preceding = value.substring(0, i);
    const kws = [...preceding.matchAll(/\b(SELECT|FROM|JOIN|WHERE|GROUP|ORDER|HAVING|LIMIT|ON|AND|OR|SET|INTO|UNION|EXCEPT|INTERSECT)\b/gi)];
    const lastKw = kws.length ? kws[kws.length - 1][1].toUpperCase() : '';

    return lastKw === 'FROM' || lastKw === 'JOIN'
      ? { type: 'table', prefix: token.toLowerCase(), prefixStart: i }
      : { type: 'any_column', prefix: token.toLowerCase(), prefixStart: i };
  }

  function updatePillHighlights() {
    const ctx = getTokenContext();
    if (!ctx || (!ctx.prefix && ctx.type !== 'column')) { clearPillHighlights(); return; }
    const pills = tableListEl.querySelectorAll('.table-pill[data-table]');

    if (ctx.type === 'table') {
      const matches = [];
      for (const pill of pills) {
        const name = pill.dataset.table;
        const hit = name.toLowerCase().startsWith(ctx.prefix);
        pill.classList.toggle('pill-match', hit);
        renderPillCols(pill, loadedTables.get(name), null);
        if (hit) matches.push(name);
      }
      sqlInput._completion = matches.length === 1 && matches[0].toLowerCase() !== ctx.prefix
        ? { text: matches[0], start: ctx.prefixStart } : null;
    } else {
      const tableFilter = ctx.type === 'column' ? ctx.table : null;
      const matchedCols = new Set();
      for (const pill of pills) {
        const name = pill.dataset.table;
        const info = loadedTables.get(name);
        if (!info) continue;
        if (tableFilter && name.toLowerCase() !== tableFilter) {
          pill.classList.remove('pill-match');
          renderPillCols(pill, info, null);
          continue;
        }
        const hits = info.columns.filter(c => c.toLowerCase().startsWith(ctx.prefix));
        pill.classList.toggle('pill-match', hits.length > 0);
        renderPillCols(pill, info, hits.length > 0 ? ctx.prefix : null);
        hits.forEach(c => matchedCols.add(c));
      }
      const unique = [...matchedCols];
      sqlInput._completion = unique.length === 1 && unique[0].toLowerCase() !== ctx.prefix
        ? { text: unique[0], start: ctx.prefixStart } : null;
    }
  }

  function clearPillHighlights() {
    sqlInput._completion = null;
    for (const pill of tableListEl.querySelectorAll('.table-pill[data-table]')) {
      pill.classList.remove('pill-match');
      const info = loadedTables.get(pill.dataset.table);
      if (info) renderPillCols(pill, info, null);
    }
  }

  function renderPillCols(pill, info, matchPrefix) {
    const el = pill.querySelector('.table-pill-cols');
    if (!el) return;
    if (!matchPrefix && matchPrefix !== '') { el.textContent = info.schema; return; }
    const lines = info.schema.split('\n');
    const matched = [], rest = [];
    for (const line of lines) {
      const col = line.trim().split(/\s+/)[0]?.toLowerCase() || '';
      (col.startsWith(matchPrefix) ? matched : rest).push({ line, hit: col.startsWith(matchPrefix) });
    }
    el.innerHTML = [...matched, ...rest].map(({ line, hit }) =>
      hit ? `<span class="col-match">${escapeHtml(line)}</span>` : escapeHtml(line)
    ).join('\n');
  }

  sqlInput.addEventListener('input', updatePillHighlights);
  sqlInput.addEventListener('click', updatePillHighlights);
  sqlInput.addEventListener('keyup', (e) => {
    if (e.key.startsWith('Arrow') || e.key === 'Home' || e.key === 'End') updatePillHighlights();
  });
  sqlInput.addEventListener('blur', clearPillHighlights);

  async function executeQuery() {
    const { selectionStart, selectionEnd, value } = sqlInput;
    const sql = (selectionStart < selectionEnd ? value.substring(selectionStart, selectionEnd) : value).trim();
    if (!sql) return;

    loadingOverlay.classList.add('active');
    resultsContent.innerHTML = '';
    runBtn.disabled = true;
    dlBtn.style.display = 'none';

    try {
      const result = await conn.query(sql);
      renderTable(result);
      lastResult = result;
      lastSql = sql;
      if (result.numRows > 0) dlBtn.style.display = '';
      updateUrlState();
    } catch (e) {
      resultsContent.innerHTML = `<div class="error-message">${e.message}</div>`;
      lastResult = null;
      lastSql = null;
    } finally {
      loadingOverlay.classList.remove('active');
      runBtn.disabled = false;
    }
  }

  function renderTable(result) {
    if (result.numRows === 0) {
      resultsContent.innerHTML = '<div style="padding:16px; color:var(--fg-dim);">No results returned.</div>';
      return;
    }

    const fields = result.schema.fields;
    const rows = result.toArray();
    
    let html = '<table><thead><tr>';
    for (const field of fields) {
      html += `<th>${escapeHtml(field.name)}</th>`;
    }
    html += '</tr></thead><tbody>';

    for (const row of rows) {
      html += '<tr>';
      for (const field of fields) {
        const val = row[field.name];
        let displayVal = val;
        
        if (val === null || val === undefined) {
          displayVal = '<span class="null-cell">null</span>';
        } else {
          const typeStr = field.type ? field.type.toString().toLowerCase() : '';
          
          if (val instanceof Date) {
             displayVal = escapeHtml(val.toISOString());
          } else if (typeStr.includes('timestamp') || typeStr.includes('date')) {
             let numVal = Number(val);
             // DuckDB often returns timestamps in microseconds. 
             if (numVal > 1e14 || numVal < -1e14) {
                 numVal = numVal / 1000;
             }
             const d = new Date(numVal);
             displayVal = escapeHtml(!isNaN(d.getTime()) ? d.toISOString().replace('T', ' ').replace('Z', '') : String(val));
          } else {
             // Let Arrow's custom objects (like BigNum) format themselves natively.
             // Their .toString() correctly returns unquoted numbers like "639617" 
             // without falling back to raw array representations or JSON quotes.
             displayVal = escapeHtml(String(val));
          }
        }
        
        html += `<td>${displayVal}</td>`;
      }
      html += '</tr>';
    }
    
    html += '</tbody></table>';
    resultsContent.innerHTML = html;
  }

  dlBtn.addEventListener('click', async () => {
    if (!lastSql) return;
    dlBtn.disabled = true;
    try {
      const vfsPath = '/__dl_result.nsv';
      await conn.query(`COPY (${lastSql.replace(/;\s*$/, '')}) TO '${vfsPath}' (FORMAT nsv)`);
      const buf = await db.copyFileToBuffer(vfsPath);
      await db.dropFile(vfsPath);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], {type: 'text/plain;charset=utf-8'}));
      a.download = loadedFileName.replace(/\.[^.]+$/, '') + '-results.nsv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    } catch (e) {
      console.error('Download failed:', e);
    } finally {
      dlBtn.disabled = false;
    }
  });

  function updateUrlState() {
    const params = new URLSearchParams();
    for (const [, info] of loadedTables) {
      if (info.sourceUrl) params.append('nsv', info.sourceUrl);
    }
    const sql = sqlInput.value.trim();
    if (sql) params.set('q', sql);
    const qs = params.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  async function loadFromUrlParams() {
    const params = new URLSearchParams(location.search);
    const urls = params.getAll('nsv');
    const query = params.get('q');
    if (urls.length === 0 && !query) return;

    if (query) sqlInput.value = query;

    for (const url of urls) {
      try { await loadFromUrl(url); } catch (_) {}
    }

    if (loadedTables.size > 0) {
      await executeQuery();
    }
  }

  loadFromUrlParams();

  function escapeHtml(unsafe) {
    return unsafe
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
  }

</script>
</body>
</html>
